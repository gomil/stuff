<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Straßennamen lernen</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pbf@3.2.1/dist/pbf.js"></script>
<style>
:root{--bg:#f4f5f7;--fg:#1c2330;--card:#fff;--ac:#2f6fdd;--bd:#d6dae1}
@media(prefers-color-scheme:dark){:root{--bg:#161a22;--fg:#e8ebf0;--card:#222834;--bd:#3a4252}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column}
header{padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}
section{flex:1;min-height:0;display:flex;flex-direction:column}
[hidden]{display:none!important}
button{font:inherit;padding:7px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
button.on{background:#e8590c;border-color:#e8590c;color:#fff}
input,select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
#tiles{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;overflow:auto}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;min-height:110px;cursor:pointer;position:relative;display:flex;flex-direction:column;justify-content:center}
.tile:hover{border-color:var(--ac)}.tile b{font-size:17px}.tile small{opacity:.65;margin-top:4px}
.tile .x{position:absolute;top:6px;right:6px;padding:0 8px;border:none;background:none;opacity:.5}
.tile.new{align-items:center;border-style:dashed;color:var(--ac);font-weight:600}
.bar{padding:8px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--bd)}
.map{flex:1;min-height:0}
.tools{display:inline-flex;gap:4px}.tool svg{vertical-align:middle;margin-right:5px}
#status{opacity:.85}#status.err{color:#d6336c;opacity:1}
#lwrap{flex:1;min-height:0;display:flex}
#lmap{flex:1;background:#eef0f3}
@media(prefers-color-scheme:dark){#lmap{background:#10141b}}
#side{width:260px;border-left:1px solid var(--bd);background:var(--card);display:flex;flex-direction:column}
#side h3{margin:0;padding:10px 12px;font-size:14px;border-bottom:1px solid var(--bd)}
#list{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
#list li{padding:8px 10px;margin:3px 0;border:1px solid var(--bd);border-radius:8px;cursor:grab;user-select:none;touch-action:none;background:var(--bg)}
#list li.drag{opacity:.35}
#ghost{position:fixed;z-index:9999;pointer-events:none;padding:6px 12px;background:var(--ac);color:#fff;border-radius:8px;box-shadow:0 4px 14px #0005;transform:translate(10px,-50%);white-space:nowrap}
#win{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:10000}
#win div{background:var(--card);padding:30px 40px;border-radius:16px;text-align:center}
#win h2{margin:0 0 8px;font-size:28px}
</style></head><body>

<header><h1 id="title">🗺️ Straßennamen lernen</h1><button id="back" hidden>← Übersicht</button></header>

<section id="home"><div id="tiles"></div></section>

<section id="pick" hidden>
 <div class="bar">
  <label>Orientierung <select id="tiles-sel"></select></label>
  <span class="tools"><button class="tool" data-m="circle" title="Kreis: Mittelpunkt + Radius"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><path d="M12 12h9"/></svg>Kreis</button><button class="tool" data-m="rect" title="Rechteck: zwei gegenüberliegende Ecken"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12"/><circle cx="3" cy="6" r="1.8" fill="currentColor" stroke="none"/><circle cx="21" cy="18" r="1.8" fill="currentColor" stroke="none"/></svg>Rechteck</button><button class="tool" data-m="rrect" title="Gedrehtes Rechteck: Seite (2 Punkte) + Höhe (3. Punkt)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 14 L13 4 L21 12 L11 22 Z"/><circle cx="3" cy="14" r="1.8" fill="currentColor" stroke="none"/><circle cx="13" cy="4" r="1.8" fill="currentColor" stroke="none"/></svg>Gedreht</button><button class="tool" data-m="poly" title="Polygon: beliebig viele Punkte"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 19 L3 9 L12 3 L21 8 L18 20 Z"/></svg>Polygon</button><button id="undo" title="Letzten Punkt zurücknehmen (ESC / Rechtsklick)">↶</button></span>
  <label>Max. Straßen <input id="max" type="number" min="1" value="100" style="width:75px"></label>
  <label>Name <input id="name" placeholder="Name des Ausschnitts"></label>
  <label><input type="checkbox" id="offl" checked> Hintergrund (Wasser, Grün, Wege) mitspeichern</label>
  <button id="save" class="p" disabled>💾 Speichern</button>
  <span id="status">Zoome zum Bereich und zeichne ein Rechteck (Maus/Finger ziehen).</span>
 </div>
 <div id="pmap" class="map"></div>
</section>

<section id="learn" hidden>
 <div class="bar"><span id="prog"></span><small style="opacity:.6;margin-left:auto">Daten: © OpenStreetMap-Mitwirkende · OpenMapTiles · OpenFreeMap</small></div>
 <div id="lwrap"><div id="lmap"></div>
  <div id="side"><h3>Straßennamen → auf die Karte ziehen</h3><ul id="list"></ul></div></div>
</section>

<div id="ghost" hidden></div>
<div id="win" hidden><div><h2>🎉 Geschafft!</h2><p>Alle Straßen richtig zugeordnet.</p><button class="p" id="winBtn">Zur Übersicht</button></div></div>

<script>
const $=s=>document.querySelector(s);
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{alert('Speicher voll – bitte Ausschnitt löschen.');return false}}};
const getIndex=()=>LS.get('sl:index',[]);

/* ---------- IndexedDB (Hintergrunddaten) ---------- */
const idb=new Promise((res,rej)=>{const r=indexedDB.open('sl',1);r.onupgradeneeded=()=>r.result.createObjectStore('t');
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const idbTx=async(m,f)=>{const d=await idb;return new Promise((res,rej)=>{const t=d.transaction('t',m),q=f(t.objectStore('t'));
 t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
const bgPut=(id,v)=>idbTx('readwrite',s=>s.put(v,id+'/bg'));
const bgGet=id=>idbTx('readonly',s=>s.get(id+'/bg')).catch(()=>null);
const bgDel=id=>idbTx('readwrite',s=>s.delete(id+'/bg')).catch(()=>{});

function show(v){['home','pick','learn'].forEach(x=>$('#'+x).hidden=x!==v);$('#back').hidden=v==='home';
 $('#title').textContent=v==='home'?'🗺️ Straßennamen lernen':v==='pick'?'Kartenausschnitt wählen':$('#title').textContent}
function home(){
 show('home');const t=$('#tiles');t.innerHTML='';
 getIndex().forEach(m=>{
  const d=document.createElement('div');d.className='tile';
  const b=document.createElement('b');b.textContent=m.name;
  const s=document.createElement('small');s.textContent=m.count+' Straßen'+(m.bg?' · mit Hintergrund':'');
  const x=document.createElement('button');x.className='x';x.textContent='✕';x.title='Löschen';
  x.onclick=e=>{e.stopPropagation();if(!confirm(`„${m.name}“ löschen?`))return;
   localStorage.removeItem('sl:map:'+m.id);localStorage.removeItem('sl:names:'+m.id);bgDel(m.id);
   LS.set('sl:index',getIndex().filter(i=>i.id!==m.id));home()};
  d.onclick=()=>learn(m.id);d.append(b,s,x);t.append(d)});
 const n=document.createElement('div');n.className='tile new';n.textContent='＋ Neuer Ausschnitt';n.onclick=pick;t.append(n);
}
$('#back').onclick=home;$('#winBtn').onclick=()=>{$('#win').hidden=true;home()};

/* ---------- Vektorkacheln (OpenFreeMap, OpenMapTiles-Schema) ---------- */
const rT=(t,r,p)=>{if(t===3){const l=p.readMessage(rL,{name:'',keys:[],values:[],feats:[],extent:4096});r[l.name]=l}};
const rL=(t,l,p)=>{if(t===1)l.name=p.readString();else if(t===2)l.feats.push(p.readMessage(rF,{tags:[],type:0,geom:[]}));
 else if(t===3)l.keys.push(p.readString());else if(t===4)l.values.push(p.readMessage(rV,{v:null}));else if(t===5)l.extent=p.readVarint()};
const rF=(t,f,p)=>{if(t===2){const e=p.readVarint()+p.pos;while(p.pos<e)f.tags.push(p.readVarint())}
 else if(t===3)f.type=p.readVarint();else if(t===4){const e=p.readVarint()+p.pos;while(p.pos<e)f.geom.push(p.readVarint())}};
const rV=(t,v,p)=>{if(t===1)v.v=p.readString();else if(t===2)v.v=p.readFloat();else if(t===3)v.v=p.readDouble();
 else if(t===4)v.v=p.readVarint(true);else if(t===5)v.v=p.readVarint();else if(t===6)v.v=p.readSVarint();else if(t===7)v.v=p.readBoolean()};
function geom(f,ext,z,X,Y){
 const g=f.geom,N=2**z,raw=[];let i=0,x=0,y=0,cur=null;
 const ll=([px,py])=>[+(Math.atan(Math.sinh(Math.PI*(1-2*(Y+py/ext)/N)))*180/Math.PI).toFixed(5),+((X+px/ext)/N*360-180).toFixed(5)];
 while(i<g.length){const c=g[i++],id=c&7,n=c>>3;if(id===7)continue;
  for(let k=0;k<n;k++){x+=(g[i]>>1)^-(g[i]&1);y+=(g[i+1]>>1)^-(g[i+1]&1);i+=2;if(id===1){cur=[];raw.push(cur)}cur.push([x,y])}}
 if(f.type===1)return raw.map(r=>ll(r[0]));
 if(f.type===2)return raw.map(r=>r.map(ll));
 const polys=[];raw.forEach(r=>{let a=0;for(let j=0;j<r.length;j++){const q=r[(j+1)%r.length];a+=r[j][0]*q[1]-q[0]*r[j][1]}
  const ring=r.map(ll);if(a>0||!polys.length)polys.push([ring]);else polys[polys.length-1].push(ring)});
 return polys;
}
/* Linie auf beliebiges Polygon (ring=[[lat,lon],...]) zuschneiden */
function inPoly(p,R){let c=false;for(let i=0,j=R.length-1;i<R.length;j=i++){
 if((R[i][1]>p[1])!==(R[j][1]>p[1])&&p[0]<(R[j][0]-R[i][0])*(p[1]-R[i][1])/(R[j][1]-R[i][1])+R[i][0])c=!c}return c}
function clipLine(P,R){
 const out=[];let cur=[];const flush=()=>{if(cur.length>1)out.push(cur);cur=[]};
 for(let i=1;i<P.length;i++){
  const a=P[i-1],b=P[i],dy=b[0]-a[0],dx=b[1]-a[1],ts=[0,1];
  for(let k=0;k<R.length;k++){const c=R[k],d=R[(k+1)%R.length],ey=d[0]-c[0],ex=d[1]-c[1],den=dx*ey-dy*ex;
   if(Math.abs(den)<1e-15)continue;
   const t=((c[1]-a[1])*ey-(c[0]-a[0])*ex)/den,u=((c[1]-a[1])*dy-(c[0]-a[0])*dx)/den;
   if(t>0&&t<1&&u>=0&&u<=1)ts.push(t)}
  ts.sort((x,y)=>x-y);
  for(let k=1;k<ts.length;k++){const t0=ts[k-1],t1=ts[k];if(t1-t0<1e-12)continue;
   const tm=(t0+t1)/2;
   if(!inPoly([a[0]+tm*dy,a[1]+tm*dx],R)){flush();continue}
   const s0=[a[0]+t0*dy,a[1]+t0*dx],e0=[a[0]+t1*dy,a[1]+t1*dx],l=cur[cur.length-1];
   if(l&&Math.abs(l[0]-s0[0])<1e-9&&Math.abs(l[1]-s0[1])<1e-9)cur.push(e0);else{flush();cur=[s0,e0]}}
 }
 flush();
 return out.map(l=>l.map(p=>[+p[0].toFixed(5),+p[1].toFixed(5)]));
}
function clipPoly(P,[w,s,e,n]){
 const E=[[p=>p[1]>=w,(a,b)=>{const t=(w-a[1])/(b[1]-a[1]);return[a[0]+t*(b[0]-a[0]),w]}],
  [p=>p[1]<=e,(a,b)=>{const t=(e-a[1])/(b[1]-a[1]);return[a[0]+t*(b[0]-a[0]),e]}],
  [p=>p[0]>=s,(a,b)=>{const t=(s-a[0])/(b[0]-a[0]);return[s,a[1]+t*(b[1]-a[1])]}],
  [p=>p[0]<=n,(a,b)=>{const t=(n-a[0])/(b[0]-a[0]);return[n,a[1]+t*(b[1]-a[1])]}]];
 for(const[ins,x]of E){const o=[];
  for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];
   if(ins(b)){if(!ins(a))o.push(x(a,b));o.push(b)}else if(ins(a))o.push(x(a,b))}
  P=o;if(!P.length)break}
 return P.length>2?P.map(p=>[+p[0].toFixed(5),+p[1].toFixed(5)]):null;
}
let tileUrl=null;
const STREET=new Set(['motorway','trunk','primary','secondary','tertiary','minor']);
const ROAD=new Set([...STREET,'service','track','path','pedestrian']);
async function loadData(shape,onProg){
 if(!tileUrl)tileUrl=(await(await fetch('https://tiles.openfreemap.org/planet')).json()).tiles[0];
 const Z=14,N=2**Z,bb=shape.bb,ring=shape.ring;
 const lx=lon=>Math.floor((lon+180)/360*N),ly=lat=>{const r=lat*Math.PI/180;return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*N)};
 const x0=lx(bb[0]),x1=lx(bb[2]),y0=ly(bb[3]),y1=ly(bb[1]),cnt=(x1-x0+1)*(y1-y0+1);
 if(cnt>30)throw new Error(`Rechteck zu groß (${cnt} Kartenkacheln, max. 30)`);
 const jobs=[];for(let X=x0;X<=x1;X++)for(let Y=y0;Y<=y1;Y++)jobs.push([X,Y]);
 const R={ways:[],bg:{roads:[],water:[],park:[]},places:[]};let done=0,nid=1;
 const run=async()=>{while(jobs.length){const[X,Y]=jobs.pop();
  const r=await fetch(tileUrl.replace('{z}',Z).replace('{x}',X).replace('{y}',Y));
  if(!r.ok)throw new Error('Kachel HTTP '+r.status);
  const T=new Pbf(new Uint8Array(await r.arrayBuffer())).readFields(rT,{});
  const each=(name,fn)=>{const l=T[name];if(!l)return;l.feats.forEach(f=>{const p={};
   for(let i=0;i<f.tags.length;i+=2)p[l.keys[f.tags[i]]]=l.values[f.tags[i+1]].v;fn(p,geom(f,l.extent,Z,X,Y),f.type)})};
  each('transportation_name',(p,G,t)=>{if(t!==2||!p.name||!STREET.has(p.class))return;
   G.forEach(line=>clipLine(line,ring).forEach(c=>R.ways.push({i:nid++,name:p.name,p:c})))});
  each('transportation',(p,G,t)=>{if(t===2&&ROAD.has(p.class))G.forEach(line=>clipLine(line,ring).forEach(c=>R.bg.roads.push(c)))});
  for(const k of['water','park'])each(k,(p,G,t)=>t===3&&G.forEach(poly=>{const rs=poly.map(r=>clipPoly(r,bb)).filter(Boolean);if(rs.length)R.bg[k].push(rs)}));
  each('place',(p,G,t)=>{if(t===1&&p.name&&G[0])R.places.push({n:p.name,c:p.class,p:G[0]})});
  onProg(++done,cnt)}};
 await Promise.all([run(),run(),run(),run()]);
 return R;
}

/* ---------- Ausschnitt wählen ---------- */
let pmap,wayLayer,selLayer,drawLayer,cur=null,mode=null,pts=[],mouse=null,loadId=0;
const NEED={circle:2,rect:2,rrect:3,poly:1e9};
const HINT={circle:'Kreis: Mittelpunkt setzen, dann einen Punkt auf dem Rand.',
 rect:'Rechteck: zwei gegenüberliegende Ecken setzen.',
 rrect:'Gedrehtes Rechteck: zwei Punkte für eine Seite, der dritte bestimmt die Höhe.',
 poly:'Polygon: beliebig viele Punkte; Klick nahe am ersten Punkt (oder Enter) schließt es.'};
function status(t,err){const s=$('#status');s.textContent=t;s.className=err?'err':''}
const KY=110574,KX=lat=>111320*Math.cos(lat*Math.PI/180);
function ringOf(m,P){
 const a=P[0],b=P[1];
 if(m==='poly')return P.map(p=>[p.lat,p.lng]);
 if(m==='rect'){const s=Math.min(a.lat,b.lat),n=Math.max(a.lat,b.lat),w=Math.min(a.lng,b.lng),e=Math.max(a.lng,b.lng);return[[s,w],[s,e],[n,e],[n,w]]}
 const k=KX(a.lat),M=p=>[(p.lng-a.lng)*k,(p.lat-a.lat)*KY],U=([x,y])=>[a.lat+y/KY,a.lng+x/k],[bx,by]=M(b);
 if(m==='circle'){const r=Math.hypot(bx,by);return Array.from({length:72},(_,i)=>{const t=i/72*2*Math.PI;return U([r*Math.cos(t),r*Math.sin(t)])})}
 const[cx,cy]=M(P[2]),l=Math.hypot(bx,by)||1,nx=-by/l,ny=bx/l,h=cx*nx+cy*ny;
 return[[0,0],[bx,by],[bx+nx*h,by+ny*h],[nx*h,ny*h]].map(U);
}
function redraw(){
 drawLayer.clearLayers();if(!mode)return;
 const P=pts.length<NEED[mode]&&mouse?[...pts,mouse]:pts;if(!P.length)return;
 const st={color:'#e8590c',weight:2,dashArray:'5 5'};
 if(P.length>=(mode==='poly'?3:NEED[mode]))L.polygon(ringOf(mode,P),{...st,fillOpacity:.08,interactive:false}).addTo(drawLayer);
 else L.polyline(P,{...st,interactive:false}).addTo(drawLayer);
 pts.forEach((q,i)=>L.circleMarker(q,{radius:i===0&&mode==='poly'?8:5,color:'#e8590c',fillColor:'#fff',fillOpacity:1,weight:2,interactive:false}).addTo(drawLayer));
}
function setMode(m){
 mode=m;pts=[];mouse=null;
 document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
 pmap.getContainer().style.cursor=m?'crosshair':'';drawLayer.clearLayers();
 if(m){selLayer.clearLayers();wayLayer.clearLayers();cur=null;$('#save').disabled=true;status(HINT[m]+' ESC/Rechtsklick: zurück.')}
 else if(!cur)status('Wähle ein Werkzeug, um einen Bereich auf der Karte festzulegen.');
}
function undo(){
 if(!mode)return;
 if(pts.length){pts.pop();redraw();status(HINT[mode]+' ESC/Rechtsklick: zurück.')}else setMode(null);
}
function finish(){
 const ring=ringOf(mode,pts).map(p=>[+p[0].toFixed(5),+p[1].toFixed(5)]);
 selLayer.clearLayers();L.polygon(ring,{color:'#e8590c',weight:2,fillOpacity:.08,interactive:false}).addTo(selLayer);
 setMode(null);fetchStreets(ring);
}
function pick(){
 show('pick');
 if(!pmap){
  pmap=L.map('pmap').setView([52.52,13.405],12);
  const T={
   'OpenStreetMap DE':['https://tile.openstreetmap.de/{z}/{x}/{y}.png',{maxZoom:19}],
   'OpenStreetMap (nur per localhost)':['https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}],
   'OpenTopoMap':['https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,subdomains:'abc'}],
   'Keine Hintergrundkarte':null};
  const sel=$('#tiles-sel');let tl=null;
  Object.keys(T).forEach(k=>sel.add(new Option(k,k)));
  sel.value=LS.get('sl:tiles','OpenStreetMap DE');if(!(sel.value in T))sel.value='OpenStreetMap DE';
  const setT=()=>{tl&&tl.remove();tl=null;LS.set('sl:tiles',sel.value);const t=T[sel.value];
   if(t)tl=L.tileLayer(t[0],{...t[1],attribution:'© OpenStreetMap-Mitwirkende'}).addTo(pmap)};
  sel.onchange=setT;setT();
  wayLayer=L.layerGroup().addTo(pmap);selLayer=L.layerGroup().addTo(pmap);drawLayer=L.layerGroup().addTo(pmap);
  navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>pmap.setView([p.coords.latitude,p.coords.longitude],14),()=>{},{timeout:6000});
  pmap.on('click',e=>{
   if(!mode)return;
   const last=pts[pts.length-1];
   if(last&&pmap.distance(last,e.latlng)<1)return;
   if(mode==='poly'&&pts.length&&pmap.latLngToContainerPoint(e.latlng).distanceTo(pmap.latLngToContainerPoint(pts[0]))<14){
    if(pts.length>=3)finish();return}
   pts.push(e.latlng);
   if(pts.length>=NEED[mode])finish();else redraw()});
  pmap.on('mousemove',e=>{if(mode){mouse=e.latlng;redraw()}});
  pmap.on('mouseout',()=>{mouse=null;redraw()});
  pmap.on('contextmenu',e=>{e.originalEvent.preventDefault();undo()});
  document.addEventListener('keydown',e=>{
   if($('#pick').hidden||!mode)return;
   if(e.key==='Escape')undo();
   else if(e.key==='Enter'&&mode==='poly'&&pts.length>=3)finish()});
  document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>setMode(mode===b.dataset.m?null:b.dataset.m));
  $('#undo').onclick=undo;
 }
 setTimeout(()=>pmap.invalidateSize(),50);
}
function upd(){
 const max=+$('#max').value||0;
 if(!cur){$('#save').disabled=true;return}
 const n=cur.names;
 if(n===0){status('Keine benannten Straßen im Bereich.',true);$('#save').disabled=true}
 else if(n>max){status(`${n} Straßen – zu viele (max. ${max}). Wähle einen kleineren Bereich.`,true);$('#save').disabled=true}
 else{status(`${n} Straßen im Bereich ✓`);$('#save').disabled=false}
}
$('#max').oninput=upd;
async function fetchStreets(ring){
 const my=++loadId,b=L.latLngBounds(ring);status('Lade Kartendaten …');
 try{
  const R=await loadData({ring,bb:[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()]},(d,n)=>my===loadId&&status(`Lade Kartendaten … ${d}/${n}`));
  if(my!==loadId||mode)return;
  const c=b.getCenter(),dist=p=>(p[0]-c.lat)**2+(p[1]-c.lng)**2;
  let nm='';
  for(const cls of[['neighbourhood','quarter'],['suburb'],['city_district'],['city','town','village']]){
   const pl=R.places.filter(x=>cls.includes(x.c)).sort((a,z)=>dist(a.p)-dist(z.p))[0];if(pl){nm=pl.n;break}}
  $('#name').value=nm||'Mein Ausschnitt';
  cur={ways:R.ways,bg:R.bg,b,ring,names:new Set(R.ways.map(w=>w.name)).size};
  R.ways.forEach(w=>L.polyline(w.p,{color:'#d6336c',weight:4}).addTo(wayLayer));
  upd();
 }catch(e){status('Fehler beim Laden: '+e.message,true)}
}
$('#save').onclick=async()=>{
 if(!cur)return;const id=Date.now().toString(36),names={};
 cur.ways.forEach(w=>names[w.i]=w.name);
 const geo={shape:cur.ring,bounds:[[cur.b.getSouth(),cur.b.getWest()],[cur.b.getNorth(),cur.b.getEast()]],ways:cur.ways.map(w=>({i:w.i,p:w.p}))};
 if(!LS.set('sl:map:'+id,geo))return;
 if(!LS.set('sl:names:'+id,names)){localStorage.removeItem('sl:map:'+id);return}
 const entry={id,name:$('#name').value.trim()||'Mein Ausschnitt',count:cur.names};
 if($('#offl').checked){try{await bgPut(id,cur.bg);entry.bg=1}catch(e){alert('Hintergrund konnte nicht gespeichert werden: '+e.message)}}
 LS.set('sl:index',[...getIndex(),entry]);
 wayLayer.clearLayers();selLayer.clearLayers();cur=null;home();
};

/* ---------- Lernen ---------- */
let lmap,lLayer,groups={},drag=null,hl=null;
const BASE={color:'#3b6fd4',weight:4},OK={color:'#1a9c3c',weight:6},HI={color:'#f59f00',weight:9},BAD={color:'#e03131',weight:8};
async function learn(id){
 const m=getIndex().find(i=>i.id===id),geo=LS.get('sl:map:'+id),names=LS.get('sl:names:'+id);
 if(!geo||!names){alert('Daten fehlen.');return}
 const bg=m.bg?await bgGet(id):null;
 show('learn');$('#title').textContent='📍 '+m.name;
 if(!lmap){lmap=L.map('lmap',{zoomSnap:.25,attributionControl:false});lLayer=L.layerGroup().addTo(lmap)}
 lLayer.clearLayers();groups={};hl=null;
 if(geo.shape)L.polygon(geo.shape,{interactive:false,fill:false,color:'#8a93a3',weight:2,dashArray:'6 6'}).addTo(lLayer);
 if(bg){const o={interactive:false,weight:0,fillOpacity:1};
  bg.water.forEach(p=>L.polygon(p,{...o,fillColor:'#b9d3ee'}).addTo(lLayer));
  bg.park.forEach(p=>L.polygon(p,{...o,fillColor:'#cfe5c4'}).addTo(lLayer));
  bg.roads.forEach(l=>L.polyline(l,{interactive:false,color:'#c3c8d0',weight:1.5}).addTo(lLayer))}
 geo.ways.forEach(w=>{const n=names[w.i];if(!n)return;
  const g=groups[n]||(groups[n]={layers:[],solved:false});
  g.layers.push(L.polyline(w.p,BASE).addTo(lLayer))});
 const list=$('#list');list.innerHTML='';
 Object.keys(groups).sort((a,b)=>a.localeCompare(b,'de')).forEach(n=>{
  const li=document.createElement('li');li.textContent=n;li.dataset.n=n;list.append(li)});
 setTimeout(()=>{lmap.invalidateSize();lmap.fitBounds(geo.bounds)},50);prog();
}
const prog=()=>{const t=Object.keys(groups).length,r=$('#list').children.length;$('#prog').textContent=`Gelernt: ${t-r} / ${t}`};
function hit(e){
 const r=lmap.getContainer().getBoundingClientRect();
 if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)return null;
 const P=L.point(e.clientX-r.left,e.clientY-r.top);let best=null,bd=16;
 for(const n in groups){const g=groups[n];if(g.solved)continue;
  for(const l of g.layers){const pts=l.getLatLngs().map(p=>lmap.latLngToContainerPoint(p));
   for(let i=1;i<pts.length;i++){const d=L.LineUtil.pointToSegmentDistance(P,pts[i-1],pts[i]);if(d<bd){bd=d;best=n}}}}
 return best;
}
function style(n,s){groups[n].layers.forEach(l=>{l.setStyle(s);s===HI&&l.bringToFront()})}
function setHl(n){if(n===hl)return;hl&&groups[hl]&&!groups[hl].solved&&style(hl,BASE);hl=n;n&&style(n,HI)}
const mv=e=>{const g=$('#ghost');g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';setHl(hit(e))};
$('#list').addEventListener('pointerdown',e=>{
 const li=e.target.closest('li');if(!li)return;e.preventDefault();
 li.setPointerCapture(e.pointerId);drag={li,n:li.dataset.n};li.classList.add('drag');
 const g=$('#ghost');g.textContent=drag.n;g.hidden=false;mv(e)});
$('#list').addEventListener('pointermove',e=>{drag&&mv(e)});
const endDrag=e=>{
 if(!drag)return;const h=e.type==='pointercancel'?null:hit(e),{li,n}=drag;drag=null;
 $('#ghost').hidden=true;setHl(null);li.classList.remove('drag');
 if(!h)return;
 if(h===n){groups[n].solved=true;style(n,OK);groups[n].layers.forEach(l=>l.bindTooltip(n,{sticky:true}));li.remove();prog();
  if(!$('#list').children.length)setTimeout(()=>$('#win').hidden=false,400)}
 else{style(h,BAD);setTimeout(()=>{if(!groups[h].solved)style(h,BASE)},800)}
};
$('#list').addEventListener('pointerup',endDrag);
$('#list').addEventListener('pointercancel',endDrag);
home();
</script></body></html>
