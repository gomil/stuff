<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernpakete</title>
<style>
:root{--bg:#f4f5f9;--card:#fff;--tx:#1d2233;--mu:#6b7288;--pr:#4f46e5;--prt:#fff;--ok:#16a34a;--ko:#dc2626;--bd:#dfe2ec;--star:#f5b301;--off:#cfd3e0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1c2030;--tx:#e8eaf3;--mu:#98a0b8;--pr:#7c78ff;--bd:#2c3248;--off:#3a415c}}
:root[data-theme="dark"]{--bg:#12141c;--card:#1c2030;--tx:#e8eaf3;--mu:#98a0b8;--pr:#7c78ff;--bd:#2c3248;--off:#3a415c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:18px 0 8px}
nav{display:flex;gap:6px;margin-bottom:14px}
nav button{flex:1}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 14px;cursor:pointer}
button.p{background:var(--pr);color:var(--prt);border-color:var(--pr)}
button.on{background:var(--pr);color:var(--prt);border-color:var(--pr)}
button.d{color:var(--ko)}button:disabled{opacity:.45;cursor:default}
input[type=text],textarea{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
textarea{min-height:110px;font-family:ui-monospace,monospace;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mu{color:var(--mu);font-size:14px}
.ico{font-size:30px;line-height:1}
.stars{font-size:20px;letter-spacing:1px;background:linear-gradient(90deg,var(--star) var(--p),var(--off) var(--p));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.pkg{display:flex;gap:12px;align-items:center;cursor:pointer}
.pkg input{width:20px;height:20px;flex:none}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.q{text-align:center;padding:26px 14px}
.q .big{font-size:26px;font-weight:600;margin:8px 0 18px;word-break:break-word}
.opts{display:grid;gap:8px}
.opts button{text-align:left;padding:13px 14px}
.opts button.ok,.fb.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opts button.ko,.fb.ko{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 18%,var(--card))}
.fb{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:12px;text-align:left}
.pair{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-bottom:6px}
.msg{padding:9px 12px;border-radius:10px;background:color-mix(in srgb,var(--pr) 14%,var(--card));margin-bottom:10px}
.tbl{overflow-x:auto}
.stage{min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:10px;cursor:pointer;user-select:none;-webkit-user-select:none;text-align:center}
.bl{width:230px;height:270px;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 55%,#fff),var(--c));color:#fff;display:flex;align-items:center;justify-content:center;padding:28px;font-weight:600;word-break:break-word;position:relative;transform-origin:50% 100%;box-shadow:inset -8px -10px 20px rgba(0,0,0,.15);margin-bottom:26px}
.bl::after{content:"";position:absolute;bottom:-14px;left:50%;margin-left:-9px;border:9px solid transparent;border-top:0;border-bottom:16px solid var(--c);transform:rotate(180deg)}
.ans{font-size:30px;font-weight:700;word-break:break-word;animation:fi .4s}
.boom{font-size:70px;animation:boom .5s forwards;height:80px}
@keyframes boom{from{transform:scale(.3);opacity:1}to{transform:scale(1.5);opacity:.15}}
.bar{width:min(320px,80%);height:6px;background:var(--off);border-radius:3px;margin-top:18px}
.bar i{display:block;height:100%;width:0;background:var(--pr);border-radius:3px}
.hi{position:relative;cursor:help;margin-left:6px;font-size:18px}
.hi:hover::after,.hi.show::after{content:attr(data-h);position:absolute;bottom:130%;left:50%;transform:translateX(-50%);width:max-content;max-width:240px;background:var(--tx);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:14px;line-height:1.35;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.25);white-space:normal}
.tip{position:fixed;z-index:50;max-width:260px;background:var(--tx);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:14px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.bridge{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bh{text-align:center;font-weight:600;margin-bottom:6px}
.bw{min-height:46px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--bd);background:var(--card);border-radius:10px;cursor:pointer;user-select:none;-webkit-user-select:none;word-break:break-word;display:flex;align-items:center;transition:opacity .4s,transform .4s,border-color .15s,background .15s}
.bw.empty{visibility:hidden}
.bw.sel{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 18%,var(--card))}
.bw.over{border-color:var(--pr);border-style:dashed}
.bw.gone{opacity:0;transform:scale(.9);pointer-events:none;border-color:var(--ok)}
.bw.shake{animation:sh .4s;border-color:var(--ko)}
.bw.fin{animation:fi .5s}
@keyframes fi{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body>
<main>
<h1>🎓 Lernpakete</h1>
<nav id="nav"></nav>
<div id="app"></div>
</main>
<script>
const K='lernpakete.v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ---------- Datenformat (lesbar) ----------
 Paket: {id,title,d1,d2,dir,pairs:[{d1,d2,hint?,stats:{d1_to_d2:{tries,correct,last},d2_to_d1:{...}}}]}
 Im Speicher wird intern mit kurzen Feldern gearbeitet (a,b,h,f,r). */
const DIR_OUT={f:'d1_to_d2',r:'d2_to_d1',both:'both'};
const DIR_IN={d1_to_d2:'f',d2_to_d1:'r',both:'both'};
function stOut(a){return{tries:a[0],correct:a[1],last:a[2]===1?'correct':a[2]===0?'wrong':null}}
function stIn(o){
  return o&&typeof o==='object'?[+o.tries||0,+o.correct||0,o.last==='correct'?1:o.last==='wrong'?0:-1]:[0,0,-1];
}
function pkgOut(p){return{id:p.id,title:p.title,d1:p.d1,d2:p.d2,dir:DIR_OUT[p.dir||'both'],
  pairs:p.pairs.map(x=>({d1:x.a,d2:x.b,...(x.h?{hint:x.h}:{}),stats:{d1_to_d2:stOut(x.f),d2_to_d1:stOut(x.r)}}))}}
function pkgIn(p){
  if(!p||!p.title||!p.d1||!p.d2||!Array.isArray(p.pairs))return null;
  const pairs=p.pairs.map(x=>{
    if(!x||!x.d1||!x.d2)return null;
    const st=x.stats||{};
    return{a:String(x.d1),b:String(x.d2),h:x.hint?String(x.hint):'',f:stIn(st.d1_to_d2),r:stIn(st.d2_to_d1)};
  }).filter(Boolean);
  if(!pairs.length)return null;
  return{id:String(p.id||Date.now().toString(36)+Math.random().toString(36).slice(2,7)),title:String(p.title),d1:String(p.d1),d2:String(p.d2),dir:DIR_IN[p.dir]||'both',pairs};
}
let S=[];try{S=(JSON.parse(localStorage.getItem(K))||[]).map(pkgIn).filter(Boolean)}catch(e){S=[]}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S.map(pkgOut)))}catch(e){}};
const getDir=p=>dirs[p.id]||p.dir||'both';
const dirLbl=(p,d)=>d==='f'?`${esc(p.d1)} → ${esc(p.d2)}`:d==='r'?`${esc(p.d2)} → ${esc(p.d1)}`:'Beide';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let V='play',sel=new Set(),dirs={},modeOpt='input',bridgeN=8,infOpt=8,regOpt=3,msg='',E=null,G=null,armed=null,timer=null;

/* ---------- Bewertung ---------- */
function rating(p){
  let t=0,k=0;
  p.pairs.forEach(x=>['f','r'].forEach(d=>{const [n,c]=x[d];t+=n?(c/n)*Math.min(1,n/3):0;k++}));
  return k?t/k*5:0;
}
function badge(r){
  const l=[[.5,'🥚','Noch nicht gestartet'],[1.5,'🐣','Erste Schritte'],[2.5,'🌱','Es wächst!'],[3.5,'🚀','Gut dabei'],[4.5,'🔥','Stark!'],[99,'🏆','Meister']];
  return l.find(x=>r<x[0]);
}
function stars(r){const v=Math.round(r*2)/2;return `<span class="stars" style="--p:${v/5*100}%" title="${v} / 5">★★★★★</span>`}
function rate(p){const r=rating(p),b=badge(r);return `<span class="ico" title="${b[2]}">${b[1]}</span>`}

/* ---------- Views ---------- */
function navV(){
  const t=[['play','🎮 Lernen'],['manage','📚 Verwalten']];
  $('#nav').innerHTML=V==='game'?'':t.map(x=>`<button class="${V===x[0]||(V==='edit'&&x[0]==='manage')?'on':''}" data-act="go" data-id="${x[0]}">${x[1]}</button>`).join('');
}
function playV(){
  const list=[...S].sort((a,b)=>rating(a)-rating(b));
  let h=msg?`<div class="msg">${msg}</div>`:'';msg='';
  if(!list.length)return h+`<div class="card">Noch keine Lernpakete vorhanden. Lege unter „📚 Verwalten“ ein Paket an oder importiere welche.</div>`;
  h+=`<h2>1. Pakete &amp; Richtung wählen</h2><p class="mu" style="margin-top:-4px">Schwächer bewertete Pakete stehen oben. Die Richtung legst du für jedes gewählte Paket einzeln fest (vorbelegt mit dem Standard des Pakets).</p>`;
  h+=list.map(p=>{const r=rating(p),on=sel.has(p.id);return `<div class="card"><label class="pkg"><input type="checkbox" data-sel="${p.id}" ${on?'checked':''}>${rate(p)}<span class="grow"><b>${esc(p.title)}</b><br><span class="mu">${esc(p.d1)} ↔ ${esc(p.d2)} · ${p.pairs.length} Paare · ${badge(r)[2]}</span></span><span style="text-align:right">${stars(r)}<br><span class="mu">${r.toFixed(1)} / 5</span></span></label>${on&&modeOpt!=='bridge'?`<div class="seg" style="margin-top:10px">${['f','r','both'].map(d=>`<button class="${getDir(p)===d?'on':''}" data-act="pdir" data-pk="${p.id}" data-id="${d}">${dirLbl(p,d)}</button>`).join('')}</div>`:''}</div>`}).join('');
  h+=`<h2>2. Modus</h2><div class="seg">${[['input','⌨️ Eingabe'],['mc','🔘 Multiple Choice'],['bridge','🌉 Wortbrücken'],['balloon','🎈 Luftballon']].map(a=>`<button class="${modeOpt===a[0]?'on':''}" data-act="mode" data-id="${a[0]}">${a[1]}</button>`).join('')}</div>`;
  const total=S.filter(p=>sel.has(p.id)).reduce((n,p)=>n+p.pairs.length,0),low=modeOpt==='bridge'&&total<4;
  if(modeOpt==='balloon')h+=`<p class="mu">Reiner Lernmodus: hat keinen Einfluss auf die Bewertung. Die Geschwindigkeiten stellst du im Spiel ein.</p>`;
  if(modeOpt==='bridge')h+=`<div class="card"><label>Anzahl Paare auf dem Spielfeld: <b id="bnv">${bridgeN}</b><input type="range" id="bn" min="4" max="20" value="${bridgeN}" style="width:100%"></label><span class="mu">Domäne 1 links, Domäne 2 rechts. Die Richtung je Paket spielt hier keine Rolle.</span>${sel.size&&low?'<div class="mu" style="color:var(--ko)">Für Wortbrücken werden mindestens 4 Paare benötigt.</div>':''}</div>`;
  h+=`<p><button class="p" data-act="start" ${sel.size&&!low?'':'disabled'}>Los geht's ▶</button></p>`;
  return h;
}
function manageV(){
  let h=msg?`<div class="msg">${msg}</div>`:'';msg='';
  h+=`<p><button class="p" data-act="new">➕ Neues Lernpaket</button></p>`;
  if(!S.length)h+=`<div class="card">Noch keine Lernpakete.</div>`;
  h+=S.map(p=>`<div class="card"><div class="row"><span class="grow"><b>${esc(p.title)}</b><br><span class="mu">${esc(p.d1)} ↔ ${esc(p.d2)} · ${p.pairs.length} Paare</span></span>${rate(p)}${stars(rating(p))}</div>
  <div class="row" style="margin-top:8px"><label class="mu"><input type="checkbox" data-exp="${p.id}" checked> Export</label><span class="grow"></span>
  <button data-act="edit" data-id="${p.id}">✏️ Bearbeiten</button>
  <button data-act="reset" data-id="${p.id}">${armed==='reset'+p.id?'Wirklich?':'↺ Bewertung zurücksetzen'}</button>
  <button class="d" data-act="del" data-id="${p.id}">${armed==='del'+p.id?'Wirklich?':'🗑'}</button></div></div>`).join('');
  h+=`<h2>Export &amp; Import</h2><p class="mu" style="margin-top:-4px">Exportiert werden die per Häkchen markierten Pakete inklusive Bewertungen als Datei.</p>
  <div class="row"><button data-act="export">📤 Exportieren (Datei)</button><label class="btn">📥 Importieren (Datei)<input type="file" id="file" accept=".json,application/json" hidden></label></div>`;
  return h;
}
function editV(){
  if(!E)E={id:null,title:'',d1:'Deutsch',d2:'Englisch',dir:'both',rows:[['','','']]};
  let h=msg?`<div class="msg">${msg}</div>`:'';msg='';
  h+=`<div class="card"><p class="mu" style="margin:0 0 4px">Titel</p><input type="text" id="t" value="${esc(E.title)}" placeholder="z.B. Vokabeln Kapitel 1">
  <div class="pair" style="margin-top:10px"><div><span class="mu">Domäne 1</span><input type="text" id="d1" value="${esc(E.d1)}"></div><div><span class="mu">Domäne 2</span><input type="text" id="d2" value="${esc(E.d2)}"></div><span></span></div></div>
  <div class="card"><p class="mu" style="margin:0 0 6px">Standard-Richtung beim Lernen</p><div class="seg">${['f','r','both'].map(d=>`<button class="${E.dir===d?'on':''}" data-act="edir" data-id="${d}">${dirLbl(E,d)}</button>`).join('')}</div></div>
  <div class="card"><b>Paare</b> <span class="mu">– mehrere Antworten mit „;“ trennen</span><div style="margin-top:8px" id="rows">`
  +E.rows.map((r,i)=>`<div class="prow"><div class="pair" style="margin-bottom:3px"><input type="text" class="ra" value="${esc(r[0])}" placeholder="${esc(E.d1)}"><input type="text" class="rb" value="${esc(r[1])}" placeholder="${esc(E.d2)}"><button data-act="delrow" data-id="${i}">✕</button></div><input type="text" class="rh" value="${esc(r[2]||'')}" placeholder="💡 Hinweis (optional)" style="margin-bottom:12px;font-size:14px"></div>`).join('')
  +`</div><button data-act="addrow">＋ Zeile</button>
  <details style="margin-top:10px"><summary class="mu">Viele Paare auf einmal einfügen</summary><p class="mu">Eine Zeile pro Paar: Begriff 1 und Begriff 2 getrennt durch Tab oder „=“.</p><textarea id="bulk" placeholder="Haus = house"></textarea><button data-act="bulk" style="margin-top:6px">Einfügen</button></details></div>
  <div class="row"><button class="p" data-act="saveE">💾 Speichern</button><button data-act="cancelE">Abbrechen</button></div>`;
  return h;
}
function gameV(){
  if(G.mode==='bridge')return bridgeV();
  if(G.mode==='balloon')return balloonV();
  const q=G.cur,st=G.st;
  const from=q.d==='f'?q.p.d1:q.p.d2,to=q.d==='f'?q.p.d2:q.p.d1;
  let h=`<div class="row" style="margin-bottom:10px"><span class="grow mu">✅ ${st.ok} · ❌ ${st.ko}</span><button data-act="end">Beenden</button></div>
  <div class="card q"><div class="mu">${esc(from)} → ${esc(to)} · ${esc(q.p.title)}</div><div class="big">${esc(q.q)}${q.x.h?` <button data-act="hint" title="Hinweis anzeigen">💡</button>`:''}</div>${G.hintOn&&q.x.h?`<div class="mu" style="margin:-10px 0 14px">💡 ${esc(q.x.h)}</div>`:''}`;
  if(G.mode==='input'){
    h+=`<input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Antwort eingeben, Enter zum Bestätigen" ${G.done?'disabled':''} value="${esc(G.val||'')}">`;
  }else{
    h+=`<div class="opts">`+G.opts.map((o,i)=>`<button data-act="opt" data-id="${i}" ${G.done?'disabled':''} class="${G.done?(o.ok?'ok':(G.pick===i?'ko':'')):''}">${esc(o.t)}</button>`).join('')+`</div>`;
  }
  if(G.done)h+=`<div class="fb ${G.right?'ok':'ko'}">${G.right?'✅ Richtig!':'❌ Leider falsch.'}${G.right?'':` Richtig wäre: <b>${esc(q.a)}</b>`}${G.right?'':`<div class="mu">Weiter mit Enter</div>`}</div>${G.right?'':`<p><button class="p" data-act="next">Weiter ▶</button></p>`}`;
  return h+`</div>`;
}
function render(){
  hideTip();
  navV();
  $('#app').innerHTML=V==='play'?playV():V==='manage'?manageV():V==='edit'?editV():gameV();
  if(V==='game'&&G.mode==='input'&&!G.done){const a=$('#ans');if(a)a.focus()}
}

/* ---------- Spiel ---------- */
function pool(){
  const out=[];
  S.filter(p=>sel.has(p.id)).forEach(p=>p.pairs.forEach(x=>{
    const dr=getDir(p);
    if(dr!=='r')out.push({p,x,d:'f'});
    if(dr!=='f')out.push({p,x,d:'r'});
  }));
  return out;
}
function weight(it){
  const [n,c,l]=it.x[it.d];
  return .4+3/(1+n)+(n?3*(1-c/n):0)+(l===0?2:0);
}
const norm=s=>String(s).toLowerCase().normalize('NFC').replace(/[.,!?;:"'„“”‚‘’¡¿]/g,'').replace(/\s+/g,' ').trim();
const parts=s=>String(s).split(/[;|]/).map(norm).filter(Boolean);
function nextQ(){
  clearTimeout(timer);
  const P=G.pool;let cand=P.length>1?P.filter(i=>i!==G.last):P;
  const w=cand.map(weight),tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot,it=cand[0];
  for(let i=0;i<cand.length;i++){r-=w[i];if(r<=0){it=cand[i];break}}
  G.last=it;
  const f=it.d==='f';
  const q={p:it.p,x:it.x,d:it.d,q:f?it.x.a:it.x.b,a:f?it.x.b:it.x.a};
  G.cur=q;G.done=false;G.val='';G.pick=null;G.hintOn=false;
  G.mode=modeOpt;
  if(modeOpt==='mc'){
    const seen=new Set([norm(q.a)]),ds=[];
    const all=it.p.pairs.map(x=>it.d==='f'?x.b:x.a).sort(()=>Math.random()-.5);
    for(const t of all){if(ds.length>=3)break;if(!seen.has(norm(t))){seen.add(norm(t));ds.push({t,ok:false})}}
    if(ds.length<1)G.mode='input';
    else G.opts=[...ds,{t:q.a,ok:true}].sort(()=>Math.random()-.5);
  }
  render();
}
function answer(ok,pick){
  if(G.done)return;
  G.done=true;G.right=ok;G.pick=pick;
  const s=G.cur.x[G.cur.d];s[0]++;if(ok)s[1]++;s[2]=ok?1:0;save();
  ok?G.st.ok++:G.st.ko++;
  render();
  if(ok)timer=setTimeout(nextQ,800);
}
function checkInput(){
  const a=$('#ans');if(!a)return;G.val=a.value;
  const acc=parts(G.cur.a),typ=parts(a.value);
  answer(typ.length>0&&typ.every(t=>acc.includes(t)));
}

/* ---------- Luftballon (nur Lernen, keine Bewertung) ---------- */
function balloonV(){
  return `<div class="row" style="margin-bottom:8px"><span class="grow mu">🎈 Luftballon – Lernmodus (ohne Bewertung)</span><button data-act="end">Beenden</button></div>
  <div class="card"><div class="row"><label class="grow">Aufblasen: <b id="binfv">${G.inf}</b> s<input type="range" id="binf" min="2" max="30" step="1" value="${G.inf}" style="width:100%"></label>
  <label class="grow">Begriff zeigen: <b id="bregv">${G.reg}</b> s<input type="range" id="breg" min="1" max="15" step="0.5" value="${G.reg}" style="width:100%"></label></div>
  <span class="mu">Tipp auf den Ballon lässt ihn sofort platzen, ein Tipp auf die Auflösung springt zum nächsten Ballon.</span></div>
  <div class="stage" id="stage" data-bl="1"></div>`;
}
function startBalloon(){
  const P=pool();if(!P.length)return;
  G={mode:'balloon',pool:P,inf:infOpt,reg:regOpt,st:{ok:0,ko:0},phase:'inflate',p:0,rp:0,last:0};
  V='game';render();balloonNext();
  G.raf=requestAnimationFrame(balloonLoop);
}
const hintIcon=h=>h?`<span class="hi" data-h="${esc(h)}">💡</span>`:'';
function balloonNext(){
  const P=G.pool,c=P.length>1?P.filter(i=>i!==G.lastIt):P,w=c.map(weight);
  let r=Math.random()*w.reduce((a,b)=>a+b,0),it=c[0];
  for(let i=0;i<c.length;i++){r-=w[i];if(r<=0){it=c[i];break}}
  G.lastIt=it;G.cur={q:it.d==='f'?it.x.a:it.x.b,a:it.d==='f'?it.x.b:it.x.a,p:it.p,d:it.d,h:it.x.h||'',hue:Math.floor(Math.random()*360)};
  G.phase='inflate';G.p=0;G.rp=0;
  const q=G.cur,f=q.d==='f'?q.p.d1:q.p.d2,t=q.d==='f'?q.p.d2:q.p.d1,n=q.q.length;
  $('#stage').innerHTML=`<div class="bl" id="bal" style="--c:hsl(${q.hue} 70% 52%);transform:scale(.2)"><span style="font-size:${n>40?14:n>15?18:24}px">${esc(q.q)}</span></div><div class="mu">${esc(f)} → ${esc(t)}${hintIcon(q.h)}</div>`;
}
function balloonPop(){
  G.phase='reveal';G.rp=0;
  const q=G.cur,f=q.d==='f'?q.p.d1:q.p.d2,t=q.d==='f'?q.p.d2:q.p.d1;
  $('#stage').innerHTML=`<div class="boom">💥</div><div class="mu">${esc(f)}: ${esc(q.q)}${hintIcon(q.h)}</div><div class="ans">${esc(q.a)}</div><div class="mu">${esc(t)}</div><div class="bar"><i id="rbar"></i></div>`;
}
function balloonLoop(ts){
  if(!G||G.mode!=='balloon')return;
  const dt=Math.min(100,G.last?ts-G.last:0);G.last=ts;
  if(G.phase==='inflate'){
    G.p+=dt/(G.inf*1000);
    if(G.p>=1)balloonPop();
    else{const b=$('#bal');if(b)b.style.transform=`scale(${.2+.8*G.p})`}
  }else{
    G.rp+=dt/(G.reg*1000);
    if(G.rp>=1)balloonNext();
    else{const b=$('#rbar');if(b)b.style.width=G.rp*100+'%'}
  }
  G.raf=requestAnimationFrame(balloonLoop);
}
function balloonTap(){if(G.phase==='inflate')balloonPop();else balloonNext()}

/* ---------- Wortbrücken ---------- */
const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const findB=id=>[...G.left,...G.right].find(i=>i&&i.id==id);
function pairW(q){return(weight({x:q.x,d:'f'})+weight({x:q.x,d:'r'}))/2}
function pickPairs(k){
  const onb=new Set(),L=new Set(),R=new Set(),out=[];
  G.left.forEach(i=>{if(i){onb.add(i.x);L.add(norm(i.x.a))}});
  G.right.forEach(i=>{if(i){onb.add(i.x);R.add(norm(i.x.b))}});
  for(let n=0;n<k;n++){
    const c=G.pairs.filter(q=>!onb.has(q.x)&&!L.has(norm(q.x.a))&&!R.has(norm(q.x.b)));
    if(!c.length)break;
    const w=c.map(pairW);let r=Math.random()*w.reduce((a,b)=>a+b,0),q=c[c.length-1];
    for(let i=0;i<c.length;i++){r-=w[i];if(r<=0){q=c[i];break}}
    out.push(q);onb.add(q.x);L.add(norm(q.x.a));R.add(norm(q.x.b));
  }
  return out;
}
function fillBoard(){
  const P=pickPairs(G.left.filter(x=>!x).length);
  const place=(arr,side)=>{const idx=shuf(arr.map((v,i)=>v?-1:i).filter(i=>i>=0));shuf(P).forEach((q,j)=>{arr[idx[j]]={id:G.seq++,p:q.p,x:q.x,side,fresh:true}})};
  place(G.left,'L');place(G.right,'R');
}
function startBridge(){
  const sp=S.filter(p=>sel.has(p.id)),ps=[];
  sp.forEach(p=>p.pairs.forEach(x=>ps.push({p,x})));
  if(ps.length<4)return;
  const same=sp.every(p=>p.d1===sp[0].d1&&p.d2===sp[0].d2);
  G={mode:'bridge',pairs:ps,N:Math.min(bridgeN,ps.length),st:{ok:0,ko:0},seq:1,sel:null,h1:same?sp[0].d1:'Domäne 1',h2:same?sp[0].d2:'Domäne 2'};
  G.left=Array(G.N).fill(null);G.right=Array(G.N).fill(null);
  fillBoard();V='game';render();
}
function bridgeV(){
  const col=(arr,side)=>arr.map(i=>i?`<div class="bw${i.fresh?' fin':''}${G.sel===i?' sel':''}" draggable="true" data-bw="${i.id}" data-side="${side}">${esc(side==='L'?i.x.a:i.x.b)}</div>`:`<div class="bw empty"></div>`).join('');
  const h=`<div class="row" style="margin-bottom:8px"><span class="grow mu" id="bcnt">✅ ${G.st.ok} · ❌ ${G.st.ko}</span><button data-act="end">Beenden</button></div>
  <div class="mu" style="margin-bottom:8px">Ziehe einen Begriff auf seinen Partner auf der anderen Seite – oder tippe beide nacheinander an.</div>
  <div class="bridge"><div><div class="bh">${esc(G.h1)}</div>${col(G.left,'L')}</div><div><div class="bh">${esc(G.h2)}</div>${col(G.right,'R')}</div></div>
  ${G.left.every(x=>!x)?'<div class="card">Keine weiteren Begriffe verfügbar – beende die Runde.</div>':''}`;
  G.left.concat(G.right).forEach(i=>{if(i)i.fresh=false});
  return h;
}
function markSel(){document.querySelectorAll('.bw').forEach(w=>w.classList.toggle('sel',!!G.sel&&G.sel.id==w.dataset.bw))}
function bridgeClick(id){
  const it=findB(id);if(!it||it.fading)return;
  if(!G.sel||G.sel.fading){G.sel=it;markSel()}
  else if(G.sel===it){G.sel=null;markSel()}
  else if(G.sel.side===it.side){G.sel=it;markSel()}
  else{const a=G.sel;G.sel=null;markSel();attempt(a,it)}
}
function attempt(a,b){
  if(a.side===b.side||a.fading||b.fading)return;
  const g=G,l=a.side==='L'?a:b,r=a.side==='L'?b:a,ok=l.x===r.x;
  const el=i=>document.querySelector(`[data-bw="${i.id}"]`);
  if(ok){
    [l.x.f,l.x.r].forEach(s=>{s[0]++;s[1]++;s[2]=1});g.st.ok++;
    l.fading=r.fading=true;[l,r].forEach(i=>el(i)&&el(i).classList.add('gone'));
    setTimeout(()=>{
      if(G!==g)return;
      g.left[g.left.indexOf(l)]=null;g.right[g.right.indexOf(r)]=null;
      if(g.left.filter(x=>!x).length*2>=g.N)fillBoard();
      render();
    },450);
  }else{
    const f=l.x.f,rr=r.x.r;f[0]++;f[2]=0;rr[0]++;rr[2]=0;g.st.ko++;
    [l,r].forEach(i=>{const e=el(i);if(e){e.classList.add('shake');setTimeout(()=>e.classList.remove('shake'),450)}});
  }
  save();const c=$('#bcnt');if(c)c.textContent=`✅ ${g.st.ok} · ❌ ${g.st.ko}`;
}
const bwOf=e=>e.target.closest?e.target.closest('.bw'):null;
let tipT=null,tipEl=null;
function hideTip(){clearTimeout(tipT);if(tipEl){tipEl.remove();tipEl=null}}
document.addEventListener('mousemove',e=>{
  hideTip();
  if(!G||G.mode!=='bridge'||G.drag)return;
  const w=bwOf(e);if(!w||!w.dataset.bw)return;
  const it=findB(w.dataset.bw);if(!it||!it.x.h||it.fading)return;
  const x=e.clientX,y=e.clientY;
  tipT=setTimeout(()=>{
    tipEl=document.createElement('div');tipEl.className='tip';tipEl.textContent='💡 '+it.x.h;document.body.appendChild(tipEl);
    const r=tipEl.getBoundingClientRect();
    tipEl.style.left=Math.max(6,Math.min(x+12,innerWidth-r.width-6))+'px';
    tipEl.style.top=Math.max(6,Math.min(y+18,innerHeight-r.height-6))+'px';
  },700);
});
['mousedown','click','dragstart','mouseout'].forEach(t=>document.addEventListener(t,hideTip,true));
document.addEventListener('dragstart',e=>{const w=bwOf(e);if(!w||!G||G.mode!=='bridge'||w.classList.contains('empty'))return;G.drag=w.dataset.bw;try{e.dataTransfer.setData('text/plain',w.dataset.bw);e.dataTransfer.effectAllowed='move'}catch(x){}});
document.addEventListener('dragover',e=>{const w=bwOf(e);if(!w||!G||G.mode!=='bridge'||!G.drag||!w.dataset.bw)return;const d=findB(G.drag);if(d&&d.side!==w.dataset.side){e.preventDefault();w.classList.add('over')}});
document.addEventListener('dragleave',e=>{const w=bwOf(e);if(w)w.classList.remove('over')});
document.addEventListener('drop',e=>{const w=bwOf(e);if(!w||!G||G.mode!=='bridge'||!G.drag)return;e.preventDefault();const d=findB(G.drag),t=findB(w.dataset.bw);G.drag=null;document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'));if(d&&t)attempt(d,t)});
document.addEventListener('dragend',()=>{if(G)G.drag=null;document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'))});

/* ---------- Editor-Hilfen ---------- */
function syncE(){
  if(!E||!$('#t'))return;
  E.title=$('#t').value;E.d1=$('#d1').value;E.d2=$('#d2').value;
  const a=[...document.querySelectorAll('.ra')],b=[...document.querySelectorAll('.rb')];
  const h=[...document.querySelectorAll('.rh')];E.rows=a.map((x,i)=>[x.value,b[i].value,h[i]?h[i].value:'']);
}
function saveE(){
  syncE();
  const rows=E.rows.map(r=>[r[0].trim(),r[1].trim(),(r[2]||'').trim()]).filter(r=>r[0]&&r[1]);
  if(!E.title.trim()||!E.d1.trim()||!E.d2.trim()||!rows.length){msg='⚠️ Bitte Titel, beide Domänen und mindestens ein vollständiges Paar angeben.';render();return}
  const old=E.id?S.find(p=>p.id===E.id):null,m={};
  if(old)old.pairs.forEach(x=>m[x.a+'\u0001'+x.b]=x);
  const pairs=rows.map(r=>{const o=m[r[0]+'\u0001'+r[1]];return{a:r[0],b:r[1],h:r[2],f:o?o.f:[0,0,-1],r:o?o.r:[0,0,-1]}});
  const p={id:E.id||uid(),title:E.title.trim(),d1:E.d1.trim(),d2:E.d2.trim(),dir:E.dir||'both',pairs};
  if(old)S[S.indexOf(old)]=p;else S.push(p);
  save();E=null;msg='✅ Lernpaket gespeichert.';V='manage';render();
}
async function exportFile(){
  const ids=[...document.querySelectorAll('[data-exp]:checked')].map(x=>x.dataset.exp);
  if(!ids.length){msg='⚠️ Bitte mindestens ein Lernpaket zum Export markieren.';render();return}
  const d=new Date(),z=n=>String(n).padStart(2,'0');
  const name=`LernPakete-${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}_${z(d.getHours())}-${z(d.getMinutes())}-${z(d.getSeconds())}.json`;
  const data=JSON.stringify({format:'lernpakete',version:2,pakete:S.filter(p=>ids.includes(p.id)).map(pkgOut)},null,1);
  try{
    const dl=window.claude&&await window.claude.use('downloads');
    if(dl){await dl.save({filename:name,data});msg=`✅ Export: ${name}`}
    else{const u=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);msg=`✅ Export: ${name}`}
  }catch(e){msg=e&&e.code==='declined'?'Export abgebrochen.':'⚠️ Export nicht möglich.'}
  render();
}
function doImport(text){
  let j;try{j=JSON.parse(text)}catch(e){msg='⚠️ Kein gültiges JSON.';render();return}
  const arr=Array.isArray(j)?j:(j&&j.pakete)||[];let n=0;
  arr.forEach(p=>{
    const np=pkgIn(p);if(!np)return;
    const i=S.findIndex(s=>s.id===np.id);if(i>=0)S[i]=np;else S.push(np);n++;
  });
  save();msg=n?`✅ ${n} Lernpaket(e) importiert.`:'⚠️ Keine gültigen Lernpakete gefunden.';render();
}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const hi=e.target.closest('.hi');
  if(hi){hi.classList.toggle('show');return}
  if(G&&G.mode==='balloon'&&!e.target.closest('[data-act]')&&e.target.closest('[data-bl]')){balloonTap();return}
  const w=e.target.closest('.bw');
  if(w&&w.dataset.bw&&G&&G.mode==='bridge'){bridgeClick(w.dataset.bw);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a!=='reset'&&a!=='del')armed=null;
  switch(a){
    case 'go':E=null;V=id;render();break;
    case 'new':E=null;V='edit';render();break;
    case 'pdir':dirs[b.dataset.pk]=id;render();break;
    case 'edir':syncE();E.dir=id;render();break;
    case 'mode':modeOpt=id;render();break;
    case 'start':{if(modeOpt==='bridge'){startBridge();break}if(modeOpt==='balloon'){startBalloon();break}const P=pool();if(!P.length)break;G={pool:P,st:{ok:0,ko:0}};V='game';nextQ();break}
    case 'end':{clearTimeout(timer);if(G.raf)cancelAnimationFrame(G.raf);const s=G.st;G=null;V='play';msg=`Runde beendet: ✅ ${s.ok} richtig, ❌ ${s.ko} falsch.`;render();break}
    case 'opt':{const o=G.opts[+id];answer(o.ok,+id);break}
    case 'next':nextQ();break;
    case 'hint':{const i=$('#ans');if(i)G.val=i.value;G.hintOn=!G.hintOn;render();break}
    case 'edit':{const p=S.find(x=>x.id===id);E={id,title:p.title,d1:p.d1,d2:p.d2,dir:p.dir||'both',rows:p.pairs.map(x=>[x.a,x.b,x.h||''])};V='edit';render();break}
    case 'reset':case 'del':{
      const k=a+id;
      if(armed===k){armed=null;
        if(a==='reset'){const p=S.find(x=>x.id===id);p.pairs.forEach(x=>{x.f=[0,0,-1];x.r=[0,0,-1]});msg='↺ Bewertung zurückgesetzt.'}
        else{S=S.filter(x=>x.id!==id);sel.delete(id);msg='🗑 Lernpaket gelöscht.'}
        save();
      }else{armed=k;setTimeout(()=>{if(armed===k){armed=null;if(V==='manage')render()}},3000)}
      render();break}
    case 'addrow':syncE();E.rows.push(['','','']);render();{const r=document.querySelectorAll('.ra');r[r.length-1].focus()}break;
    case 'delrow':syncE();E.rows.splice(+id,1);if(!E.rows.length)E.rows=[['','','']];render();break;
    case 'bulk':{syncE();const t=$('#bulk').value.split('\n');
      const add=t.map(l=>l.split(/\t|=/).map(s=>s.trim())).filter(x=>x.length>=2&&x[0]&&x[1]).map(x=>[x[0],x.slice(1).join('='),'']);
      E.rows=E.rows.filter(r=>r[0]||r[1]).concat(add);if(!E.rows.length)E.rows=[['','','']];render();break}
    case 'saveE':saveE();break;
    case 'cancelE':E=null;V='manage';render();break;
    case 'export':exportFile();break;
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='binf'){infOpt=G.inf=+e.target.value;$('#binfv').textContent=G.inf;return}
  if(e.target.id==='breg'){regOpt=G.reg=+e.target.value;$('#bregv').textContent=G.reg;return}
  if(e.target.id==='bn'){bridgeN=+e.target.value;$('#bnv').textContent=bridgeN;return}
  if(e.target.id!=='d1'&&e.target.id!=='d2')return;
  const v1=$('#d1').value,v2=$('#d2').value;
  document.querySelectorAll('.ra').forEach(x=>x.placeholder=v1);
  document.querySelectorAll('.rb').forEach(x=>x.placeholder=v2);
  document.querySelectorAll('[data-act=edir]').forEach(b=>b.innerHTML=dirLbl({d1:v1,d2:v2},b.dataset.id));
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.sel){t.checked?sel.add(t.dataset.sel):sel.delete(t.dataset.sel);render()}
  if(t.id==='file'&&t.files[0]){const r=new FileReader();r.onload=()=>doImport(String(r.result));r.onerror=()=>{msg='⚠️ Datei konnte nicht gelesen werden.';render()};r.readAsText(t.files[0]);t.value=''}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(V==='game'&&G&&(G.mode==='bridge'||G.mode==='balloon'))return;
  if(V==='game'&&G){e.preventDefault();
    if(G.done){if(!G.right||true)nextQ()}
    else if(G.mode==='input')checkInput();
  }else if(V==='edit'&&e.target.classList.contains('rb')){
    const rb=[...document.querySelectorAll('.rb')];
    if(e.target===rb[rb.length-1]){syncE();E.rows.push(['','','']);render();const r=document.querySelectorAll('.ra');r[r.length-1].focus()}
    else rb[rb.indexOf(e.target)+1]&&document.querySelectorAll('.ra')[rb.indexOf(e.target)+1].focus();
  }
});
render();
</script>
</body>
